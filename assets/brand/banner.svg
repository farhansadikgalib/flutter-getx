<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">flutter-getx</title>
  <desc id="d">Production-ready Flutter apps with GetX, from one command. getx create page:home</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02569B"/>
      <stop offset="0.55" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#6B2FBF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54C5F8"/>
      <stop offset="1" stop-color="#B98CFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1130" cy="70" r="180" fill="#B98CFF" fill-opacity="0.12"/>
  <circle cx="140" cy="380" r="160" fill="#54C5F8" fill-opacity="0.10"/>

  <!-- Flutter-style mark -->
  <g transform="translate(96 128)">
    <path d="M58 0 L96 0 L24 72 L5 53 Z" fill="#54C5F8"/>
    <path d="M58 66 L96 66 L63 99 L44 80 Z" fill="#54C5F8"/>
    <path d="M44 80 L63 99 L96 132 L58 132 L25 99 Z" fill="#0288D1"/>
    <path d="M25 99 L44 80 L63 99 L44 118 Z" fill="#29B6F6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="232" y="188" font-size="76" font-weight="800" letter-spacing="-1.5">flutter<tspan fill="url(#glow)">-getx</tspan></text>
    <text x="234" y="234" font-size="27" fill-opacity="0.88">Production-ready Flutter apps with GetX, from one command.</text>
  </g>

  <!-- command pill -->
  <g transform="translate(232 272)">
    <rect width="566" height="64" rx="32" fill="#0B1020" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="34" y="41" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#E6EDF3">
      <tspan fill="#7EE787">$</tspan> getx create <tspan fill="#54C5F8">page:</tspan><tspan fill="#FFFFFF" font-weight="700">home</tspan> <tspan fill="#B98CFF">on</tspan> shop
    </text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.82">
    <text x="830" y="311">Claude Code · Codex · any agent · terminal</text>
  </g>
</svg>
